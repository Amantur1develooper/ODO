name: odo

x-backend: &backend
  build: ./backend
  image: odo-backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-odo}:${POSTGRES_PASSWORD:-odo}@db:5432/${POSTGRES_DB:-odo}
    DATA_DIR: /data
    GOTENBERG_URL: http://gotenberg:3000
    USE_X_ACCEL: "true"
  volumes:
    - ./data/files:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odo}
      POSTGRES_USER: ${POSTGRES_USER:-odo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odo}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # LibreOffice в контейнере: Word/Excel/PowerPoint → PDF для просмотра на сайте
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=300s", "--libreoffice-restart-after=50"]

  backend:
    <<: *backend

  worker:
    <<: *backend
    command: ["python", "manage.py", "run_worker"]
    depends_on:
      backend:
        condition: service_started

  web:
    build: ./web
    image: odo-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./data/files:/data:ro
    depends_on:
      - backend
