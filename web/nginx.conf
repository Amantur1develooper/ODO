# Если перед ОДО стоит ещё один прокси с HTTPS — сохраняем исходную схему.
map $http_x_forwarded_proto $odo_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Файлы грузятся кусками по 16 МБ, так что большой лимит не нужен.
    client_max_body_size 64m;
    client_body_buffer_size 1m;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        # .mjs (воркер PDF.js) нет в стандартных mime.types nginx
        location ~ \.mjs$ {
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location ~ ^/(api|admin|django-static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $odo_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Отдача файлов после проверки прав в Django (X-Accel-Redirect):
    # nginx сам поддерживает Range — видео начинает играть сразу и перематывается без скачивания.
    location /protected/ {
        internal;
        alias /data/;
        sendfile on;
        tcp_nopush on;
        aio threads;
        output_buffers 2 1m;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
